name: deploy-to-releases

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/run-tests.yml
    # Pass COMPOSER_AUTH (and any other secrets) down to the reusable workflow;
    # called workflows do not inherit the caller's secrets automatically.
    secrets: inherit

  release:
    name: Build and upload production package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # One install, from the lockfile: Mozart builds includes/Dependencies from
      # it, and bundle:prune then takes out the framework modules composer.json
      # excludes. The plugin loads itself through includes/autoload.php and
      # nothing from vendor, so vendor is not packed and needs no second,
      # production install to empty it.
      # Scoped to this step: a job-level secret is visible to every step,
      # including third-party actions.
      - name: Install composer dependencies
        env:
          COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
        run: composer install

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      # .distignore is the one list of what stays out of a package, vendor and
      # composer.json among it. The names after it are repository files that
      # have no place in an installed plugin and that .distignore, a
      # framework-managed file, does not name.
      - name: Prepare production package directory
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          PACKAGE_DIR="${RUNNER_TEMP}/${REPO_NAME}"
          mkdir -p "${PACKAGE_DIR}"

          rsync -av ./ "${PACKAGE_DIR}/" \
            --exclude-from=".distignore" \
            --exclude "/README.md" \
            --exclude "/CHANGELOG.md" \
            --exclude "/icon.png" \
            --exclude "/jest.config.cjs"

      - name: Cleanup non-runtime translation source files
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          PACKAGE_DIR="${RUNNER_TEMP}/${REPO_NAME}"
          if [ -d "${PACKAGE_DIR}/languages" ]; then
            find "${PACKAGE_DIR}/languages" -type f \( -name "*.pot" -o -name "*.po" \) -delete
          fi

      - name: Zip production package
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          cd "${RUNNER_TEMP}"
          zip -r "${REPO_NAME}-${TAG_NAME}.zip" "${REPO_NAME}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/${{ github.event.repository.name }}-${{ github.event.release.tag_name }}.zip
