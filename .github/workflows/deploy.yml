name: deploy-to-releases

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    name: Build and upload production package
    runs-on: ubuntu-latest
    env:
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install composer dependencies (build phase)
        run: composer install

      - name: Reinstall composer dependencies for production
        run: composer update --no-dev --no-scripts --optimize-autoloader

      - name: Install Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Prepare production package directory
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          PACKAGE_DIR="${RUNNER_TEMP}/${REPO_NAME}"
          mkdir -p "${PACKAGE_DIR}"

          rsync -av ./ "${PACKAGE_DIR}/" \
            --exclude ".git/" \
            --exclude ".agents/" \
            --exclude ".claude/" \
            --exclude ".codex/" \
            --exclude ".github/" \
            --exclude "docs/" \
            --exclude "node_modules/" \
            --exclude "src/" \
            --exclude "tests/" \
            --exclude ".distignore" \
            --exclude ".editorconfig" \
            --exclude ".eslintrc.js" \
            --exclude ".gitignore" \
            --exclude ".phpunit.result.cache" \
            --exclude ".travis.yml" \
            --exclude ".wp-env.json" \
            --exclude "AGENTS.md" \
            --exclude "CHANGELOG.md" \
            --exclude "CLAUDE.md" \
            --exclude "composer.json" \
            --exclude "composer.lock" \
            --exclude "package.json" \
            --exclude "package-lock.json" \
            --exclude "phpcs.xml" \
            --exclude "phpmd.xml" \
            --exclude "phpstan.neon" \
            --exclude "phpunit.xml.dist" \
            --exclude "webpack.config.js" \
            --exclude "README.md" \
            --exclude "icon.png" \
            --exclude "DOCKER_ENV/" \
            --exclude "docker_tag" \
            --exclude "output.log"

      - name: Cleanup non-runtime translation source files
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          PACKAGE_DIR="${RUNNER_TEMP}/${REPO_NAME}"
          if [ -d "${PACKAGE_DIR}/languages" ]; then
            find "${PACKAGE_DIR}/languages" -type f \( -name "*.pot" -o -name "*.po" \) -delete
          fi

      - name: Zip production package
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          cd "${RUNNER_TEMP}"
          zip -r "${REPO_NAME}.zip" "${REPO_NAME}"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/${{ github.event.repository.name }}.zip
