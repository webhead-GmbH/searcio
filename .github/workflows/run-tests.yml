name: Run Tests

on:
  pull_request:
    branches: [ master ]
  workflow_call:

jobs:
  unit-tests:
    name: Execute Unit Tests (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [ "8.4", "8.3" ]
        wp: [ "latest", "6.0" ]
      fail-fast: false

    steps:
      -   name: Checkout repository
          uses: actions/checkout@v3

      -   name: Setup Node.js
          uses: actions/setup-node@v3
          with:
            node-version: '20'

      -   name: Setup PHP ${{ matrix.php }}
          uses: shivammathur/setup-php@v2
          with:
            php-version: '${{ matrix.php }}'
            extensions: mbstring, intl
            coverage: none

      -   name: Install Composer dependencies
          run: composer install --no-progress --no-suggest --prefer-dist

      -   name: Install NPM dependencies
          run: npm ci

      -   name: Generate .wp-env.json for WP ${{ matrix.wp }}
          run: |
            cat > .wp-env.json <<EOF
            {
              "core": "https://wordpress.org/wordpress-${{ matrix.wp }}.zip",
              "plugins": [
                ".",
                "https://downloads.wordpress.org/plugin/elementor.latest-stable.zip",
                "https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip"
              ],
              "env": {
                "tests": {
                  "phpVersion": "${{ matrix.php }}"
                }
              }
            }
            EOF

      -   name: Start wp-env
          run: |
            set -euo pipefail
            started=false
            for i in {1..3}; do
              echo "🟢 wp-env start attempt #$i"
              if npm run wp-env -- start; then
                started=true
                break
              fi
              echo "❌ wp-env start failed, stopping containers and retrying..."
              npm run wp-env -- stop || true
              sleep 10
            done

            if [ "${started}" != "true" ]; then
              echo "::error::wp-env did not start after 3 attempts."
              exit 1
            fi

      -   name: Wait for tests-cli and database to be ready
          run: |
            set -euo pipefail
            ready=false
            wp_env_path="$(npm run wp-env --silent -- install-path | head -n 1)"
            compose_file="${wp_env_path}/docker-compose.yml"

            for i in {1..30}; do
              if docker compose -f "${compose_file}" ps --status running --services tests-cli | grep -qx tests-cli \
                && npm run wp-env -- run tests-cli wp db check; then
                ready=true
                break
              fi

              echo "Waiting for tests-cli and MySQL… ($i/30)"
              docker compose -f "${compose_file}" ps
              sleep 5
            done

            if [ "${ready}" != "true" ]; then
              echo "::error::tests-cli or MySQL did not become ready."
              docker compose -f "${compose_file}" ps
              docker compose -f "${compose_file}" logs --tail=100 tests-cli tests-wordpress tests-mysql || true
              exit 1
            fi

      -   name: Run PHPUnit
          run: npm run test:unit

      -   name: Stop wp-env
          if: always()
          run: npm run wp-env -- stop
